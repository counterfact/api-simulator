name: Mutation Testing

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-testing:
    name: Mutation Testing (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package:
          - client
          - counterfact
          - generator
          - openapi
          - repl
          - runtime
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7
      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install Packages
        run: yarn install --immutable
      - name: Build Workspaces
        run: yarn build
      - name: Restore Mutation Baseline
        uses: actions/cache@v5
        with:
          path: reports/mutation/${{ matrix.package }}/incremental.json
          key: mutation-${{ runner.os }}-node24-${{ matrix.package }}-${{ github.sha }}
          restore-keys: |
            mutation-${{ runner.os }}-node24-${{ matrix.package }}-
      - name: Run Full Mutation Baseline
        run: yarn test:mutation:incremental --package ${{ matrix.package }} --force
      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.package }}
          path: reports/mutation/${{ matrix.package }}
          if-no-files-found: warn
          retention-days: 30
