name: Generator reuse examples

on:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: generator-reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    name: Local SDK reuse (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - openapi-typescript
          - hey-api
          - orval
          - openapi-generator-fetch
          - openapi-generator-axios
          - swagger-typescript-api
          - openapi-typescript-codegen
          - nswag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install repository dependencies
        run: yarn install --immutable
      - name: Build Counterfact
        run: yarn build
      - uses: actions/setup-java@v5
        if: startsWith(matrix.target, 'openapi-generator-')
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v5
        if: matrix.target == 'nswag'
        with:
          dotnet-version: "8.0.x"
      - name: Generate, compile and run the local project
        id: proof
        run: yarn test:generator-reuse "${{ matrix.target }}"
      - name: Keep generated project and verification results
        if: always() && steps.proof.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: generator-reuse-${{ matrix.target }}
          path: artifacts/generator-reuse/${{ matrix.target }}/
          if-no-files-found: error
