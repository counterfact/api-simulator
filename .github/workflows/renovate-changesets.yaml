name: Renovate Changesets

on:
  pull_request_target:
    branches:
      - main

jobs:
  generate-changeset:
    runs-on: ubuntu-latest
    if: |
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Generate changeset
        uses: actions/github-script@v9
        with:
          script: |
            const { promises: fs } = require("fs");
            const baseSha = context.payload.pull_request.base.sha;

            const branch = (await exec.getExecOutput("git branch --show-current")).stdout.trim();
            if (!branch.startsWith("renovate/")) {
              console.log("Not a renovate branch, skipping");
              return;
            }

            const diffOutput = await exec.getExecOutput("git", [
              "diff",
              "--name-only",
              `${baseSha}...HEAD`,
            ]);
            const diffFiles = diffOutput.stdout.trim().split("\n").filter(Boolean);

            if (diffFiles.some((f) => f.startsWith(".changeset"))) {
              console.log("Changeset already exists, skipping");
              return;
            }

            const packageJsonFiles = diffFiles.filter((file) =>
              /^packages\/[^/]+\/package\.json$/.test(file),
            );
            const productionFields = [
              "dependencies",
              "optionalDependencies",
              "peerDependencies",
            ];
            const releases = new Map();

            for (const file of packageJsonFiles) {
              const current = JSON.parse(await fs.readFile(file, "utf8"));
              if (current.private) continue;

              const previousResult = await exec.getExecOutput("git", [
                "show",
                `${baseSha}:${file}`,
              ], { ignoreReturnCode: true });
              if (previousResult.exitCode !== 0) continue;
              const previous = JSON.parse(previousResult.stdout);
              const messages = [];

              for (const field of productionFields) {
                const before = previous[field] ?? {};
                const after = current[field] ?? {};
                for (const dependency of new Set([
                  ...Object.keys(before),
                  ...Object.keys(after),
                ])) {
                  if (before[dependency] === after[dependency]) continue;
                  messages.push(
                    after[dependency] === undefined
                      ? `Removed dependency \`${dependency}\` from \`${current.name}\`.`
                      : `Updated dependency \`${dependency}\` in \`${current.name}\` to \`${after[dependency]}\`.`,
                  );
                }
              }

              if (messages.length) releases.set(current.name, messages);
            }

            if (!releases.size) {
              console.log("No public production dependency changes, skipping");
              return;
            }

            const { stdout: shortHash } = await exec.getExecOutput("git rev-parse --short HEAD");
            const fileName = `.changeset/renovate-${shortHash.trim()}.md`;

            const frontmatter = [...releases.keys()]
              .sort()
              .map((name) => `'${name}': patch`)
              .join("\n");
            const message = [...releases.values()].flat().join("\n");
            const body = `---\n${frontmatter}\n---\n\n${message}\n`;
            await fs.writeFile(fileName, body);

            await exec.exec("git", ["add", fileName]);
            await exec.exec("git", ["commit", "-m", "chore: add changeset for renovate dependency update"]);
            await exec.exec("git", ["push"]);
