name: CI Checks

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docs-only.outputs.docs_only }}
    steps:
      - name: Detect docs-only pull request
        id: docs-only
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("docs_only", "false");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            if (files.length === 0) {
              core.setOutput("docs_only", "false");
              return;
            }

            const docsOnly = files.every((file) => file.filename.toLowerCase().endsWith(".md"));
            core.setOutput("docs_only", docsOnly ? "true" : "false");

  checks:
    name: ${{ matrix.check }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: Static checks, os: ubuntu-latest, build: true }
          - { check: Build-runner tests, os: ubuntu-latest, build: false }
          - { check: Build-runner tests, os: windows-latest, build: false }
          - { check: TypeScript, os: ubuntu-latest, build: true }
          - { check: Public type tests, os: ubuntu-latest, build: true }
          - { check: Public type tests, os: windows-latest, build: true }
          - { check: Unit tests, os: ubuntu-latest, build: true }
          - { check: Packaging, os: ubuntu-latest, build: false }
          - { check: Black-box tests, os: ubuntu-latest, build: true }
          - { check: Black-box tests, os: windows-latest, build: true }
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable Corepack
        run: corepack enable
      - name: Locate Yarn download cache
        if: matrix.check == 'Black-box tests'
        id: yarn-cache
        shell: bash
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Cache black-box Yarn downloads
        if: matrix.check == 'Black-box tests'
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: black-box-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: black-box-yarn-${{ runner.os }}-
      - name: Install Packages
        run: yarn install --immutable
      - name: Build Workspaces
        if: matrix.build
        run: yarn build
      - name: Build Runner Tests
        if: matrix.check == 'Build-runner tests'
        run: yarn test:build
      - name: TypeSafe helper tests (offline)
        if: matrix.check == 'Build-runner tests'
        run: yarn test:typesafe
      - name: Package Boundary Tests
        if: matrix.check == 'Static checks'
        run: yarn test:boundaries
      - name: Package Boundaries
        if: matrix.check == 'Static checks'
        run: yarn check:boundaries
      - name: ESLint
        if: matrix.check == 'Static checks'
        run: yarn eslint -f github-annotations .
      - name: TypeScript
        if: matrix.check == 'TypeScript'
        run: yarn typecheck
      # One lifecycle build and shared tarballs, isolated from other CI jobs.
      - name: Cache packaging downloads
        if: matrix.check == 'Packaging'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/counterfact-package-npm-cache
          key: package-npm-${{ runner.os }}-${{ hashFiles('yarn.lock', 'packages/*/package.json') }}
          restore-keys: package-npm-${{ runner.os }}-
      - name: Packaging Runner Tests
        if: matrix.check == 'Packaging'
        run: yarn test:packaging-runner
      - name: Package Consumer Tests
        if: matrix.check == 'Packaging'
        timeout-minutes: 20
        env:
          COUNTERFACT_PACKAGE_CACHE: ${{ runner.temp }}/counterfact-package-npm-cache
        run: yarn test:package-closures
      - name: Unit Tests
        if: matrix.check == 'Unit tests'
        timeout-minutes: 10
        run: yarn test:coverage --maxWorkers=4 --forceExit --verbose --no-watchman
      - name: Coveralls
        if: matrix.check == 'Unit tests' && github.event_name != 'merge_group'
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
      - name: Set up Python
        if: matrix.check == 'Black-box tests'
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: test-black-box/requirements.txt
      - name: Install Python dependencies
        if: matrix.check == 'Black-box tests'
        run: pip install -r test-black-box/requirements.txt
      - name: Black Box Tests
        if: matrix.check == 'Black-box tests'
        timeout-minutes: 5
        # Build Workspaces already compiled this job's isolated checkout.
        run: yarn test:black-box:run
      - name: Type Tests
        if: matrix.check == 'Public type tests'
        timeout-minutes: 2
        run: yarn test:tsd

  # Preserve the existing required check names, including their OS suffixes.
  ci-checks:
    name: CI Checks
    needs: [changes, checks]
    if: always()
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Verify all required checks
        uses: actions/github-script@v9
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        with:
          script: |
            const { CHANGES_RESULT, DOCS_ONLY, CHECKS_RESULT } = process.env;
            if (CHANGES_RESULT !== 'success') {
              core.setFailed(`Change classification did not succeed: ${CHANGES_RESULT}`);
              return;
            }
            const expected = DOCS_ONLY === 'true' ? 'skipped' : 'success';
            if (CHECKS_RESULT !== expected) {
              core.setFailed(`Required checks: expected ${expected}, got ${CHECKS_RESULT}`);
              return;
            }
            core.info(DOCS_ONLY === 'true'
              ? 'Markdown-only pull request: heavy checks intentionally skipped.'
              : 'All required checks passed.');
