name: CI Checks

on:
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ci-checks:
    name: CI Checks
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Debug
        run: echo "${{ matrix.os }}"
      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect docs-only pull request
        id: docs-only
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("docs_only", "false");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            if (files.length === 0) {
              core.setOutput("docs_only", "false");
              return;
            }

            const docsOnly = files.every((file) => file.filename.toLowerCase().endsWith(".md"));
            core.setOutput("docs_only", docsOnly ? "true" : "false");

      - name: Agent guidance integrity
        if: matrix.os != 'windows-latest'
        run: node scripts/check-agent-guidance.mjs

      - name: Skip heavy checks for docs-only changes
        if: steps.docs-only.outputs.docs_only == 'true'
        run: echo "Markdown-only pull request detected. Skipping lint/type/tests while keeping required checks green."
      - uses: actions/setup-node@v7
        if: steps.docs-only.outputs.docs_only != 'true'
        with:
          node-version: 24.x
      - name: Enable Corepack
        if: steps.docs-only.outputs.docs_only != 'true'
        run: corepack enable
      - name: Install Packages
        if: steps.docs-only.outputs.docs_only != 'true'
        run: yarn install --immutable
      - name: Build Workspaces
        if: steps.docs-only.outputs.docs_only != 'true'
        run: yarn build
      - name: Package Boundary Tests
        if: steps.docs-only.outputs.docs_only != 'true' && matrix.os != 'windows-latest'
        run: yarn test:boundaries
      - name: Agent Guidance Tests
        if: steps.docs-only.outputs.docs_only != 'true' && matrix.os != 'windows-latest'
        run: yarn test:agent-guidance
      - name: Package Boundaries
        if: steps.docs-only.outputs.docs_only != 'true' && matrix.os != 'windows-latest'
        run: yarn check:boundaries
      - name: ESlint
        if: steps.docs-only.outputs.docs_only != 'true' && matrix.os != 'windows-latest'
        run: yarn eslint -f github-annotations .
      - name: TypeScript
        if: steps.docs-only.outputs.docs_only != 'true' && matrix.os != 'windows-latest'
        run: yarn typecheck
      - name: Packed Consumer Test
        if: steps.docs-only.outputs.docs_only != 'true' && matrix.os != 'windows-latest'
        timeout-minutes: 5
        run: yarn test:packed-consumer
      - name: Exact Package Closure Tests
        if: steps.docs-only.outputs.docs_only != 'true' && matrix.os != 'windows-latest'
        timeout-minutes: 15
        run: yarn test:package-closures
      - name: Unit Tests
        if: steps.docs-only.outputs.docs_only != 'true' && matrix.os != 'windows-latest'
        timeout-minutes: 2
        run: yarn test --runInBand --forceExit --verbose --no-watchman
      - name: Set up Python
        if: steps.docs-only.outputs.docs_only != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Python dependencies
        if: steps.docs-only.outputs.docs_only != 'true'
        run: pip install -r test-black-box/requirements.txt
      - name: Black Box Tests
        if: steps.docs-only.outputs.docs_only != 'true'
        timeout-minutes: 5
        run: yarn test:black-box
      - name: Type Tests
        if: steps.docs-only.outputs.docs_only != 'true'
        timeout-minutes: 2
        run: yarn build && yarn test:tsd
