name: Debug Windows

on:
  workflow_dispatch:

env:
  DEBUG: "counterfact:*"

jobs:
  ci-checks:
    name: Debug Windows
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install Packages
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Show files
        run: Get-ChildItem -Recurse
